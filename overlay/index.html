<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Power Mode</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-phase="observe" data-status="ready" data-preset="focus">
    <canvas id="effects" aria-hidden="true"></canvas>
    <main>
      <section id="hud" class="floating-hud collapsed" aria-live="polite">
        <div class="core">
          <div class="orbit"><i></i></div>
          <div id="momentum-meter" class="meter">
            <strong id="momentum">0</strong>
          </div>
        </div>
        <div class="copy">
          <div class="eyebrow"><span id="phase">OBSERVE</span><i></i><b id="connection">LIVE</b></div>
          <strong id="event">Codex Power ready</strong>
          <span id="status-copy">Waiting for the next useful step</span>
          <div class="meta"><span id="confidence">CONF 0%</span><span id="evidence">NO EVIDENCE</span><span id="risk-level">LOW RISK</span></div>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
