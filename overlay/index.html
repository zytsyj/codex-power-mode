<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Power Mode</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-phase="observe" data-status="ready" data-preset="focus">
    <canvas id="effects" aria-hidden="true"></canvas>
    <div class="atmosphere" aria-hidden="true"></div>
    <main>
      <section id="hud" class="power-system collapsed" aria-live="polite">
        <div class="reactor-wrap">
          <div class="reactor-halo"></div>
          <div class="reactor">
            <div class="tick-ring"></div>
            <div id="momentum-meter" class="momentum-ring"></div>
            <div class="reactor-core">
              <strong id="momentum">0</strong>
              <span id="power-label">POWER</span>
            </div>
          </div>
          <div id="combo-meter" class="combo-meter" aria-label="Codex combo">
            <b id="combo-count">0×</b>
            <i><span id="combo-bar"></span></i>
            <em id="combo-status">READY</em>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
