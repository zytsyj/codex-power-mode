<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Power Mode</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-phase="observe" data-status="ready" data-preset="focus">
    <canvas id="effects" aria-hidden="true"></canvas>
    <div class="atmosphere" aria-hidden="true"></div>
    <main>
      <section id="hud" class="power-system collapsed" aria-live="polite">
        <div class="reactor-wrap">
          <div class="reactor-halo"></div>
          <div class="reactor">
            <div class="tick-ring"></div>
            <div id="momentum-meter" class="momentum-ring"></div>
            <div class="reactor-core">
              <strong id="momentum">0</strong>
              <span>POWER</span>
            </div>
          </div>
          <div class="combo-meter" aria-label="Codex combo">
            <b id="combo-count">0×</b>
            <i><span id="combo-bar"></span></i>
            <em id="combo-status">READY</em>
          </div>
        </div>
        <div class="telemetry">
          <div class="telemetry-head">
            <span class="phase-mark"><i></i><b id="phase">OBSERVE</b></span>
            <span id="connection" class="connection">FOCUS</span>
          </div>
          <strong id="event">Codex Power ready</strong>
          <span id="status-copy" class="status-copy">Waiting for the next useful step</span>
          <div class="signals">
            <span id="evidence" class="evidence">NO EVIDENCE</span>
            <span id="confidence">CONF 0%</span>
            <span id="risk-level" class="risk">LOW RISK</span>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
