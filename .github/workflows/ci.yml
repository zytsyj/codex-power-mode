name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run check

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile native overlay
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library -O \
            native/macos/PowerModeOverlay.swift \
            -framework AppKit -framework Foundation \
            -o /tmp/codex-power-mode-overlay
          file /tmp/codex-power-mode-overlay
          CODEX_POWER_MODE_PLACEMENT_SELF_TEST=1 /tmp/codex-power-mode-overlay
          CODEX_POWER_MODE_RECONNECT_SELF_TEST=1 /tmp/codex-power-mode-overlay
          SETTINGS_PATH="$(mktemp -d)/settings.json"
          CODEX_POWER_MODE_SETTINGS_SELF_TEST=1 \
            CODEX_POWER_MODE_CONFIG_PATH="$SETTINGS_PATH" \
            /tmp/codex-power-mode-overlay
          CODEX_POWER_MODE_LAYER_BUDGET_SELF_TEST=1 /tmp/codex-power-mode-overlay
