name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run check

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native overlay
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library -O \
            native/macos/PowerModeOverlay.swift \
            -framework AppKit -framework Foundation \
            -o /tmp/codex-power-mode-overlay
          file /tmp/codex-power-mode-overlay
