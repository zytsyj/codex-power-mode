name: Bug report
description: Report a reproducible Power Mode problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Power Mode. Do not include prompts, source code, tokens, private paths, or screenshots containing private Codex content.
  - type: input
    id: version
    attributes:
      label: Power Mode version
      placeholder: 0.9.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac architecture, and Codex desktop version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Display mode
      options:
        - Focus
        - Arcade
        - Classic Power Mode
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted examples only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed prompts, code, tokens, usernames, private paths, and private screenshots.
          required: true
        - label: This is not a security vulnerability.
          required: true
